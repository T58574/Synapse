[package]
name = "synapse"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[dependencies]
synapse-audio-engine = { git = "https://github.com/T58574/synapse-audio-engine.git" }
slint = { version = "1.8", features = ["backend-default"] }
lofty = "0.21"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "fs"] }
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
rfd = "0.15"

[build-dependencies]
slint-build = "1.8"

[dev-dependencies]
tempfile = "3.10"
